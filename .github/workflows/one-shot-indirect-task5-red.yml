name: One-shot indirect task5 RED

on:
  push:
    paths:
      - tools/one_shot_indirect_task5_red.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-indirect-jump-call-v0
          fetch-depth: 0
      - name: Apply startup RED assertions
        run: python tools/one_shot_indirect_task5_red.py
      - name: Commit startup RED
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r5900_block_dispatcher_startup_windows_tests.cpp
          git commit -m "test: require startup JR JALR continuation"
          git push origin HEAD:feature/r5900-indirect-jump-call-v0
