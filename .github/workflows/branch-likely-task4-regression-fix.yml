name: Branch Likely Task4 Regression Fix

on:
  push:
    paths:
      - 'tools/apply_branch_likely_task4_regression_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-branch-likely-v0
          fetch-depth: 0
      - name: Update legacy boundary fixture
        run: python tools/apply_branch_likely_task4_regression_fix.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r5900_block_dispatcher_direct_transfer_windows_tests.cpp
          git commit -m "test: move direct-transfer boundary past BNEL"
          git push origin HEAD:feature/r5900-branch-likely-v0
