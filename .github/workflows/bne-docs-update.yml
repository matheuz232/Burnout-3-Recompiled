name: BNE Docs Update

on:
  push:
    branches:
      - feature/r5900-bne-delay-slot-v0
    paths:
      - tools/bne_docs_update.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/bne_docs_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record BNE startup milestone"
          git push
