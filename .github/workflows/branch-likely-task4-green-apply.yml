name: Branch Likely Task4 GREEN Apply

on:
  push:
    paths:
      - 'tools/apply_branch_likely_task4_green.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-branch-likely-v0
          fetch-depth: 0
      - name: Apply Task 4 GREEN
        run: python tools/apply_branch_likely_task4_green.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recompiler/windows/r5900_block_dispatcher.cpp
          git commit -m "feat: dispatch R5900 likely branches"
          git push origin HEAD:feature/r5900-branch-likely-v0
