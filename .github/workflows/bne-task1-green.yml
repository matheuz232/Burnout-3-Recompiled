name: BNE Task1 GREEN

on:
  push:
    branches:
      - feature/r5900-bne-delay-slot-v0
    paths:
      - tools/bne_task1_green.py

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply GREEN production patch
        run: python tools/bne_task1_green.py
      - name: Commit GREEN production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recompiler/windows/r5900_block_dispatcher.cpp
          git diff --cached --quiet && exit 0
          git commit -m "feat: dispatch BNE through equality terminator"
          git push
