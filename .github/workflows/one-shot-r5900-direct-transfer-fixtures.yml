name: One-shot R5900 direct-transfer fixture alignment

'on':
  push:
    branches:
      - feature/r5900-direct-jump-call-v0
    paths:
      - .github/workflows/one-shot-r5900-direct-transfer-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-direct-jump-call-v0
          fetch-depth: 0

      - name: Patch integration fixtures
        run: python tools/one_shot_direct_transfer_fixtures.py

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "unsupported indirect control-flow terminator" tests/r5900_block_dispatcher_windows_tests.cpp
          grep -q "successful SQ+J block" tests/r5900_block_dispatcher_store128_windows_tests.cpp
          grep -q "SYNTHETIC_STARTUP_J_JAL_VALIDATED" tests/r5900_block_dispatcher_startup_windows_tests.cpp
          grep -q "kIndirectReturnPc" tests/r5900_block_dispatcher_startup_windows_tests.cpp

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r5900_block_dispatcher_windows_tests.cpp tests/r5900_block_dispatcher_store128_windows_tests.cpp tests/r5900_block_dispatcher_startup_windows_tests.cpp
          git commit -m "test: align direct-transfer integration fixtures"
          git push origin HEAD:feature/r5900-direct-jump-call-v0
