name: One-shot R5900 direct-transfer fixture alignment

'on':
  push:
    branches:
      - feature/r5900-direct-jump-call-v0
    paths:
      - .github/workflows/one-shot-r5900-direct-transfer-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-direct-jump-call-v0
          fetch-depth: 0

      - name: Patch integration fixtures
        shell: python
        run: |
          from pathlib import Path

          # 1) Legacy dispatcher boundary test: only indirect JR/JALR remain unsupported.
          path = Path('tests/r5900_block_dispatcher_windows_tests.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''        const std::vector<std::uint32_t> terminators = {
            j_type(0x02, base + 0x20u),
            j_type(0x03, base + 0x20u),
            r_type(31, 0, 0, 0, 0x08),
        };
'''
          new = '''        const std::vector<std::uint32_t> terminators = {
            r_type(31, 0, 0, 0, 0x08),
            r_type(31, 0, 30, 0, 0x09),
        };
'''
          if text.count(old) != 1:
              raise SystemExit('legacy dispatcher terminator vector anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"supported prefix must stop before unsupported control-flow terminator"',
              '"supported prefix must stop before unsupported indirect control-flow terminator"',
              1)
          path.write_text(text, encoding='utf-8')

          # 2) Store128 integration: successful block now includes following J + delay.
          path = Path('tests/r5900_block_dispatcher_store128_windows_tests.cpp')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    constexpr std::uint32_t sentinel = code_base + 4u;\n', '', 1)
          old = '''        expect(result.reason == R5900DispatchStopReason::ControlFlow,
               "successful SQ body must stop at following J boundary");
        expect(result.next_pc == sentinel,
               "successful SQ body boundary PC mismatch");
        expect(result.blocks_executed == 1u && result.instructions_executed == 1u,
               "successful SQ body must complete one block/instruction");
'''
          new = '''        expect(result.reason == R5900DispatchStopReason::BlockBudgetExhausted,
               "successful SQ+J block must consume one block budget");
        expect(result.next_pc == code_base + 0x40u,
               "successful SQ+J block target mismatch");
        expect(result.blocks_executed == 1u && result.instructions_executed == 3u,
               "successful SQ+J block must count SQ, J and delay slot");
'''
          if text.count(old) != 1:
              raise SystemExit('Store128 first success anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''        expect(second.reason == R5900DispatchStopReason::ControlFlow,
               "corrected runtime address must let cached SQ execute");
        expect(second.cache_hits == 1u && second.recompilations == 0u,
'''
          new = '''        expect(second.reason == R5900DispatchStopReason::BlockBudgetExhausted &&
                   second.next_pc == code_base + 0x40u,
               "corrected runtime address must let cached SQ+J block execute");
        expect(second.cache_hits == 1u && second.recompilations == 0u,
'''
          if text.count(old) != 1:
              raise SystemExit('Store128 cached success anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Startup E2E: replace old J sentinel with J -> JAL -> callee -> JR boundary.
          path = Path('tests/r5900_block_dispatcher_startup_windows_tests.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''constexpr std::uint32_t kSqPc = 0x00100160u;
constexpr std::uint32_t kSyntheticSentinelPc = 0x00100164u;
constexpr std::uint32_t kSqTarget = 0x004e2680u;
'''
          new = '''constexpr std::uint32_t kSqPc = 0x00100160u;
constexpr std::uint32_t kDirectJumpPc = 0x00100164u;
constexpr std::uint32_t kDirectJumpTarget = 0x00100180u;
constexpr std::uint32_t kDirectCallPc = 0x00100180u;
constexpr std::uint32_t kDirectCallTarget = 0x001001a0u;
constexpr std::uint32_t kIndirectReturnPc = 0x001001a4u;
constexpr std::uint32_t kExpectedLinkPc = 0x00100188u;
constexpr std::uint32_t kSqTarget = 0x004e2680u;
'''
          if text.count(old) != 1:
              raise SystemExit('startup constants anchor mismatch')
          text = text.replace(old, new, 1)

          marker = '''constexpr std::uint32_t mmi_type(std::uint8_t rs,
'''
          j_encoder = '''constexpr std::uint32_t j_type(std::uint8_t op, std::uint32_t target) {
    return (static_cast<std::uint32_t>(op) << 26u) |
           ((target >> 2u) & 0x03ffffffu);
}

'''
          if text.count(marker) != 1:
              raise SystemExit('startup j_type insertion anchor mismatch')
          text = text.replace(marker, j_encoder + marker, 1)
          text = text.replace('    words.reserve(89u);\n', '    words.reserve(105u);\n', 1)

          old = '''    // Control-flow sentinel after SQ: the dispatcher must execute SQ, then stop
    // before this J at the next boundary. The mapped NOP is its analyzer delay slot.
    words.push_back(0x08000000u);
    words.push_back(0u);
    expect(words.size() == 89u, "synthetic startup mapped sentinel count mismatch");
    expect(base + static_cast<std::uint32_t>((words.size() - 2u) * 4u) ==
               kSyntheticSentinelPc,
           "synthetic startup sentinel PC mismatch");
'''
          new = '''    words.push_back(j_type(0x02u, kDirectJumpTarget));          // 0x164 J
    words.push_back(i_type(0x09u, 0u, 22u, 0x0033u));       // 0x168 delay
    words.push_back(i_type(0x09u, 0u, 25u, 1u));            // 0x16c poison
    words.push_back(i_type(0x09u, 0u, 26u, 1u));            // 0x170 poison
    words.push_back(i_type(0x09u, 0u, 27u, 1u));            // 0x174 poison
    words.push_back(i_type(0x09u, 0u, 28u, 1u));            // 0x178 poison
    words.push_back(i_type(0x09u, 0u, 30u, 1u));            // 0x17c poison
    words.push_back(j_type(0x03u, kDirectCallTarget));          // 0x180 JAL
    words.push_back(i_type(0x09u, 31u, 23u, 0u));           // 0x184 delay sees r31
    words.push_back(i_type(0x09u, 0u, 25u, 2u));            // 0x188 poison
    words.push_back(i_type(0x09u, 0u, 26u, 2u));            // 0x18c poison
    words.push_back(i_type(0x09u, 0u, 27u, 2u));            // 0x190 poison
    words.push_back(i_type(0x09u, 0u, 28u, 2u));            // 0x194 poison
    words.push_back(i_type(0x09u, 0u, 30u, 2u));            // 0x198 poison
    words.push_back(0u);                                    // 0x19c guard
    words.push_back(i_type(0x09u, 0u, 24u, 0x0055u));       // 0x1a0 callee
    words.push_back(r_type(31u, 0u, 0u, 0u, 0x08u));        // 0x1a4 JR r31
    words.push_back(0u);                                    // 0x1a8 mapped JR delay
    expect(words.size() == 105u, "synthetic J/JAL fixture count mismatch");
    expect(base + static_cast<std::uint32_t>(87u * 4u) == kDirectJumpPc,
           "synthetic direct J PC mismatch");
    expect(base + static_cast<std::uint32_t>(94u * 4u) == kDirectCallPc,
           "synthetic direct JAL PC mismatch");
'''
          if text.count(old) != 1:
              raise SystemExit('startup sentinel replacement anchor mismatch')
          text = text.replace(old, new, 1)

          text = text.replace(
              '    state.gpr[31] = {0x1122334455667788ull, 0x8877665544332211ull};\n\n    const auto result = dispatcher.run(base, state, 3u);\n',
              '    const auto result = dispatcher.run(base, state, 5u);\n',
              1)

          old = '''    expect(result.reason == R5900DispatchStopReason::ControlFlow,
           "synthetic startup must advance through SQ to sentinel J");
    expect(result.next_pc == kSyntheticSentinelPc,
           "synthetic startup next boundary mismatch");
    expect(result.blocks_executed == 3u,
           "synthetic startup must complete the SQ block");
    expect(result.instructions_executed == 82u,
           "synthetic startup must execute 81 prior instructions plus SQ");
'''
          new = '''    expect(result.reason == R5900DispatchStopReason::ControlFlow,
           "startup must stop at unsupported JR");
    expect(result.next_pc == kIndirectReturnPc,
           "startup JR boundary mismatch");
    expect(result.blocks_executed == 5u,
           "startup block count mismatch");
    expect(result.instructions_executed == 87u,
           "startup instruction count mismatch");
'''
          if text.count(old) != 1:
              raise SystemExit('startup result assertion anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    expect(state.gpr[21].low64 == 0x22u,
           "synthetic startup second delay slot must execute");
    for (std::uint8_t index = 10u; index < 15u; ++index) {
'''
          new = '''    expect(state.gpr[21].low64 == 0x22u,
           "synthetic startup second delay slot must execute");
    expect(state.gpr[22].low64 == 0x33u,
           "J delay slot mismatch");
    expect(state.gpr[23].low64 == kExpectedLinkPc,
           "JAL delay link observation mismatch");
    expect(state.gpr[24].low64 == 0x55u,
           "callee prefix mismatch");
    for (std::uint8_t index = 10u; index < 15u; ++index) {
'''
          if text.count(old) != 1:
              raise SystemExit('startup direct-transfer assertion insertion mismatch')
          text = text.replace(old, new, 1)

          old = '''    expect(state.gpr[31].low64 == 0x1122334455667788ull &&
               state.gpr[31].high64 == 0x8877665544332211ull,
           "synthetic startup sentinel GPR31 must remain unchanged");

    std::cout << "SYNTHETIC_STARTUP_SQ_VALIDATED sq=0x00100160 target=0x004e2680 "
                 "stop=0x00100164 blocks=3 instructions=82\\n";
'''
          new = '''    expect(state.gpr[31].low64 == kExpectedLinkPc,
           "JAL link mismatch");
    expect(state.gpr[31].high64 == 0u,
           "startup r31 high64 mismatch");
    expect(state.gpr[25].low64 == 0u && state.gpr[26].low64 == 0u &&
               state.gpr[27].low64 == 0u && state.gpr[28].low64 == 0u &&
               state.gpr[30].low64 == 0u,
           "direct-transfer poison fallthrough must remain untouched");

    std::cout << "SYNTHETIC_STARTUP_J_JAL_VALIDATED sq=0x00100160 target=0x004e2680 "
                 "stop=0x001001a4 blocks=5 instructions=87\\n";
'''
          if text.count(old) != 1:
              raise SystemExit('startup final assertion/output anchor mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "unsupported indirect control-flow terminator" tests/r5900_block_dispatcher_windows_tests.cpp
          grep -q "successful SQ+J block" tests/r5900_block_dispatcher_store128_windows_tests.cpp
          grep -q "SYNTHETIC_STARTUP_J_JAL_VALIDATED" tests/r5900_block_dispatcher_startup_windows_tests.cpp
          grep -q "kIndirectReturnPc" tests/r5900_block_dispatcher_startup_windows_tests.cpp

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r5900_block_dispatcher_windows_tests.cpp tests/r5900_block_dispatcher_store128_windows_tests.cpp tests/r5900_block_dispatcher_startup_windows_tests.cpp
          git commit -m "test: align direct-transfer integration fixtures"
          git push origin HEAD:feature/r5900-direct-jump-call-v0
