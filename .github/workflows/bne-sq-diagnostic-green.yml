name: BNE SQ Diagnostic GREEN

on:
  push:
    branches:
      - feature/r5900-bne-delay-slot-v0
    paths:
      - tools/bne_sq_diagnostic_green.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/bne_sq_diagnostic_green.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recompiler/windows/r5900_block_dispatcher.cpp
          git diff --cached --quiet && exit 0
          git commit -m "fix: identify BNE SQ delay scope"
          git push
