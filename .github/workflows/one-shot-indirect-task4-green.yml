name: One-shot indirect task4 GREEN

on:
  push:
    paths:
      - tools/one_shot_indirect_task4_green.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-indirect-jump-call-v0
          fetch-depth: 0
      - name: Apply dispatcher GREEN
        run: python tools/one_shot_indirect_task4_green.py
      - name: Commit dispatcher GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recompiler/windows/r5900_block_dispatcher.cpp tests/r5900_block_dispatcher_direct_transfer_windows_tests.cpp
          git commit -m "feat: dispatch R5900 indirect transfers"
          git push origin HEAD:feature/r5900-indirect-jump-call-v0
