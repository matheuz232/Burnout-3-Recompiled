name: One-shot indirect task3 patch

on:
  push:
    paths:
      - tools/one_shot_indirect_task3.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-indirect-jump-call-v0
          fetch-depth: 0
      - name: Apply task3 patch
        run: python tools/one_shot_indirect_task3.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/recompiler/windows/r5900_x64_backend.cpp tests/r5900_x64_direct_transfer_windows_tests.cpp
          git commit -m "feat: emit native R5900 indirect transfers"
          git push origin HEAD:feature/r5900-indirect-jump-call-v0
