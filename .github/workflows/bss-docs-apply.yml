name: BSS Docs Apply

on:
  push:
    branches:
      - feature/r5900-bss-clear-loop-v0
    paths:
      - .github/bss_docs_apply.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply BSS milestone docs
        run: python .github/bss_docs_apply.py
