name: One-shot register direct-transfer tests

'on':
  push:
    branches:
      - feature/r5900-direct-jump-call-v0
    paths:
      - .github/workflows/one-shot-register-direct-transfer-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-direct-jump-call-v0
          fetch-depth: 0

      - name: Register focused tests
        run: python tools/one_shot_register_direct_transfer_tests.py

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "r5900_ir_direct_transfer_validation_tests" CMakeLists.txt
          grep -q "r5900_ir_direct_transfer_executor_tests" CMakeLists.txt
          grep -q "r5900_x64_direct_transfer_windows_tests" CMakeLists.txt
          grep -q "r5900_block_dispatcher_direct_transfer_windows_tests" CMakeLists.txt

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "test: register focused R5900 direct-transfer targets"
          git push origin HEAD:feature/r5900-direct-jump-call-v0
