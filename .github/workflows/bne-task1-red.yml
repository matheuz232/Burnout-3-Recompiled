name: BNE Task1 RED

on:
  push:
    branches:
      - feature/r5900-bne-delay-slot-v0
    paths:
      - tools/bne_task1_red.py

permissions:
  contents: write

jobs:
  apply-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RED test patch
        run: python tools/bne_task1_red.py
      - name: Commit RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r5900_block_dispatcher_windows_tests.cpp
          git diff --cached --quiet && exit 0
          git commit -m "test: expect BNE dispatcher execution"
          git push
