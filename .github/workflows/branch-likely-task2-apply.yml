name: Branch Likely Task2 Apply

on:
  push:
    paths:
      - 'tools/apply_branch_likely_task2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-branch-likely-v0
          fetch-depth: 0
      - name: Apply Task 2
        run: python tools/apply_branch_likely_task2.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/recompiler/r5900_ir_executor.cpp tests/r5900_ir_indirect_transfer_executor_tests.cpp tests/r5900_ir_branch_likely_executor_tests.cpp
          git commit -m "feat: execute R5900 likely branches"
          git push origin HEAD:feature/r5900-branch-likely-v0
