name: Branch Likely Task4 RED Apply

on:
  push:
    paths:
      - 'tools/apply_branch_likely_task4_red.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-branch-likely-v0
          fetch-depth: 0
      - name: Apply Task 4 RED
        run: python tools/apply_branch_likely_task4_red.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt tests/r5900_block_dispatcher_branch_likely_windows_tests.cpp
          git commit -m "test: add branch-likely dispatcher RED"
          git push origin HEAD:feature/r5900-branch-likely-v0
