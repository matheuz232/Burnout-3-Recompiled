name: One-shot R5900 direct-transfer backend patch

on:
  push:
    branches:
      - feature/r5900-direct-jump-call-v0
    paths:
      - .github/workflows/one-shot-r5900-direct-transfer-backend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-direct-jump-call-v0
          fetch-depth: 0

      - name: Patch backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/recompiler/windows/r5900_x64_backend.cpp")
          text = path.read_text(encoding="utf-8")

          namespace_needle = """    return publish_code(bytes);\n}\n\n} // namespace\n\nR5900X64CompiledBlock::R5900X64CompiledBlock"""
          direct_function = r'''    return publish_code(bytes);
          }

          PendingX64Code compile_direct_transfer_code(const R5900IrBlock& block) {
              const bool helper_frame =
                  sequence_needs_helper(block.body) ||
                  sequence_needs_helper(block.terminator.delay_slot);

              std::vector<std::uint8_t> bytes;
              bytes.reserve(128u +
                            block.body.size() * 128u +
                            block.terminator.delay_slot.size() * 256u);

              if (helper_frame) {
                  emit_helper_frame_prologue(bytes);
              }
              emit_zero_gpr0(bytes);

              const auto body_emitted = emit_ir_sequence(
                  bytes,
                  block.body,
                  0u,
                  helper_frame);
              if (!body_emitted.ok()) {
                  return pending_failure(body_emitted.error, body_emitted.message);
              }

              if (block.terminator.kind == R5900IrTerminatorKind::DirectCall) {
                  emit_mov_eax_imm32(bytes, block.terminator.link_pc);
                  emit_store_rax_to_state(bytes, gpr_low64_offset(31u));
              }

              emit_zero_gpr0(bytes);
              const auto delay_emitted = emit_ir_sequence(
                  bytes,
                  block.terminator.delay_slot,
                  block.body.size() + 1u,
                  helper_frame);
              if (!delay_emitted.ok()) {
                  return pending_failure(delay_emitted.error, delay_emitted.message);
              }

              emit_zero_gpr0(bytes);
              emit_mov_eax_imm32(bytes, block.terminator.target_pc);
              if (helper_frame) {
                  emit_helper_frame_epilogue(bytes);
              }
              bytes.push_back(0xc3u);
              return publish_code(bytes);
          }

          } // namespace

          R5900X64CompiledBlock::R5900X64CompiledBlock'''
          direct_function = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in direct_function.splitlines()
          )

          if text.count(namespace_needle) != 1:
              raise SystemExit("direct-transfer insertion anchor not found exactly once")
          text = text.replace(namespace_needle, direct_function, 1)

          switch_needle = """    case R5900IrTerminatorKind::BranchEqual64:\n        pending = compile_branch_equal_code(block);\n        break;\n    default:\n"""
          switch_replacement = """    case R5900IrTerminatorKind::BranchEqual64:\n        pending = compile_branch_equal_code(block);\n        break;\n    case R5900IrTerminatorKind::DirectJump:\n    case R5900IrTerminatorKind::DirectCall:\n        pending = compile_direct_transfer_code(block);\n        break;\n    default:\n"""
          if text.count(switch_needle) != 1:
              raise SystemExit("direct-transfer switch anchor not found exactly once")
          text = text.replace(switch_needle, switch_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "compile_direct_transfer_code" src/recompiler/windows/r5900_x64_backend.cpp
          git diff -- src/recompiler/windows/r5900_x64_backend.cpp

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recompiler/windows/r5900_x64_backend.cpp
          git commit -m "feat: emit native R5900 direct transfers"
          git push origin HEAD:feature/r5900-direct-jump-call-v0
