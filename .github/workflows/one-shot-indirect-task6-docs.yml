name: One-shot indirect task6 docs

on:
  push:
    paths:
      - tools/one_shot_indirect_task6_docs.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-indirect-jump-call-v0
          fetch-depth: 0
      - name: Update milestone documentation
        run: python tools/one_shot_indirect_task6_docs.py
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PROGRESS.md
          git commit -m "docs: record R5900 JR JALR milestone"
          git push origin HEAD:feature/r5900-indirect-jump-call-v0
