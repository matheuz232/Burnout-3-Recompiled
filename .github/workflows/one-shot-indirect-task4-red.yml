name: One-shot indirect task4 RED

on:
  push:
    paths:
      - tools/one_shot_indirect_task4_red.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-indirect-jump-call-v0
          fetch-depth: 0
      - name: Register RED target
        run: python tools/one_shot_indirect_task4_red.py
      - name: Commit RED target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "test: register indirect dispatcher RED coverage"
          git push origin HEAD:feature/r5900-indirect-jump-call-v0
