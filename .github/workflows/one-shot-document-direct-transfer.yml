name: One-shot document direct-transfer milestone

'on':
  push:
    branches:
      - feature/r5900-direct-jump-call-v0
    paths:
      - .github/workflows/one-shot-document-direct-transfer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r5900-direct-jump-call-v0
          fetch-depth: 0

      - name: Update milestone documentation
        run: python tools/one_shot_document_direct_transfer.py

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "5 native guest blocks / 87 guest instructions" README.md
          grep -q "DirectJump" README.md
          grep -q "33954774597" docs/PROGRESS.md
          grep -q "43/43" docs/PROGRESS.md
          grep -q "EXTERNALLY_VALIDATED.*intentionally not claimed" docs/PROGRESS.md

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PROGRESS.md
          git commit -m "docs: record R5900 direct jump call milestone"
          git push origin HEAD:feature/r5900-direct-jump-call-v0
